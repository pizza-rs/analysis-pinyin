[package]
name = "pizza-analysis-pinyin"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/pizza-rs/analysis-pinyin"
categories = ["text-processing"]
keywords = ["pizza", "pinyin", "chinese", "tokenizer", "search"]
authors = ["INFINI Labs Team",]
license = "MIT"
description = "Chinese Pinyin conversion plugin for INFINI Pizza"
build = "build.rs"


[features]
# Default bakes the optimized per-character primary/polyphone tables into the
# binary at build time (fastest, self-contained).
default = ["embed", "embed-fallback"]
# Embed the raw dictionary text as a runtime fallback (used in no-embed builds).
# Disable for a smaller binary that loads only from config/analysis/pinyin/.
embed-fallback = []
# Compile-time codegen of the lookup tables. Disable to load `pinyin.txt` /
# `pinyin_alphabet.dict` at runtime from the external `config/analysis/pinyin/`
# directory (editable), with the embedded raw text as a fallback.
embed = []
# Bundle the ~11 MB polyphone phrase dictionary for context-aware
# disambiguation (e.g. `银行` → `yin hang`, not `yin xing`). Opt-in.
polyphone-dict = ["embed"]
std = ["pizza-engine/std"]

[dependencies]
pizza-common = { path = "../../lib/common" }
pizza-engine = { path = "../../lib/engine", default-features = false }
hashbrown = { version = "0.14", default-features = false }

[dev-dependencies]
